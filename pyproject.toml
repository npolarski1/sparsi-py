[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparsi-py"
version = "0.1.0"
description = "Deterministic-first AI workflows in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Gemini CLI", email = "gemini-cli@example.com" },
]
dependencies = [
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
    "anthropic>=0.45.0",
    "google-genai>=1.0.0",
    "aiofiles>=23.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dagor", "sparsi"]
